; =====================================================================
;  Template โปรเจกต์แรกของบอร์ด ESP32-2432S028 (CYD)  -- Level 1 / Lab 1
;
;  Firmware 1.2.0: OpenWeather HTTPS + DHT22 GPIO27 + LDR/RGB + TFT touch/swipes
;  ใช้ TFT_eSPI และ XPT2046 โดยตรง; LVGL ยังไม่ได้ใช้ในเฟิร์มแวร์นี้
; =====================================================================

[platformio]
default_envs = esp32dev
; Keep build artifacts in /tmp; PlatformIO recreates them if removed after reboot.
build_dir = /tmp/cyd-esp32-weather-build

[env:esp32dev]
; ใช้เวอร์ชันเดียวกับชุดที่ตรวจ Build บน Ubuntu นี้
platform = espressif32@7.1.3
board = esp32dev
framework = arduino

; ใช้สิทธิ์ dialout ที่เพิ่มไว้แล้ว แม้ VS Code ยังเป็นเซสชันเดิม
extra_scripts =
  pre:scripts/embed_web.py
  post:scripts/serial_permissions.py
  post:scripts/optimize_build.py

; Optimize across application files; leave Arduino/ESP-IDF and interrupt libraries unchanged.
build_src_flags = -flto

monitor_speed = 115200
upload_speed = 921600

; Ubuntu: ให้ PlatformIO ตรวจพอร์ต USB อัตโนมัติ
; ถ้ามีหลายบอร์ด ให้เปิดสองบรรทัดนี้และใช้พอร์ตที่แสดงจาก device list
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0
; Remote SSH ต้องให้เครื่อง Ubuntu ปลายทางมองเห็น USB ของบอร์ด

; ถ้า build แล้วฟ้องว่าโปรแกรมใหญ่เกิน flash (เช่น LVGL + WiFi) ให้เปิดบรรทัดนี้
; board_build.partitions = huge_app.csv

build_flags =
  ; ---- จอ TFT: ไดรเวอร์ ILI9341 และ pin (ต้องตรงกับ include/board_config.h) ----
  -D USER_SETUP_LOADED
  ; Touch uses XPT2046_Touchscreen on VSPI; TFT_eSPI only drives the HSPI display.
  ; Leave TOUCH_CS undefined: TFT_eSPI's touch extension would use the wrong bus.
  ; Suppress TFT_eSPI's optional-feature warnings; compiler warnings remain enabled.
  -D DISABLE_ALL_LIBRARY_WARNINGS
  -D ILI9341_DRIVER
  -D USE_HSPI_PORT
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH
  -D LOAD_GLCD
  -D LOAD_FONT2
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=20000000
  ; ---- LVGL: ให้หา lv_conf.h ในโฟลเดอร์ include ----
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -Iinclude
  -std=gnu++17

build_unflags =
  -std=gnu++11

lib_deps =
  bodmer/TFT_eSPI@2.5.43
  bblanchon/ArduinoJson@6.21.6
  adafruit/DHT sensor library@1.4.7
  adafruit/Adafruit Unified Sensor@1.1.15
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#f956c5d8ce3bf39169c7378416b89e7cfe70a034

; ไลบรารีเพิ่มเติมสำหรับ Lab touch / LVGL (เพิ่มใน lib_deps เมื่อต้องใช้)
;   https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
;   lvgl/lvgl@~8.3.11
