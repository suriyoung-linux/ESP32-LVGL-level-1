; =====================================================================
;  Template โปรเจกต์แรกของบอร์ด ESP32-2432S028 (CYD)  -- Level 1 / Lab 1
;
;  โปรแกรมปัจจุบันใช้ Serial + LDR + RGB LED + จอ TFT ผ่าน TFT_eSPI
;  ตั้งค่าจอสัมผัสและ LVGL ไว้สำหรับ Lab ถัดไป
; =====================================================================

[platformio]
default_envs = esp32dev
; Root disk on this Ubuntu is full; /tmp has space and PlatformIO recreates this after reboot.
build_dir = /tmp/cyd-esp32-weather-build

[env:esp32dev]
; ใช้เวอร์ชันเดียวกับชุดที่ตรวจ Build บน Ubuntu นี้
platform = espressif32@7.1.3
board = esp32dev
framework = arduino

; ใช้สิทธิ์ dialout ที่เพิ่มไว้แล้ว แม้ VS Code ยังเป็นเซสชันเดิม
extra_scripts = post:scripts/serial_permissions.py

monitor_speed = 115200
upload_speed = 921600

; Ubuntu: ให้ PlatformIO ตรวจพอร์ต USB อัตโนมัติ
; ถ้ามีหลายบอร์ด ให้เปิดสองบรรทัดนี้และใช้พอร์ตที่แสดงจาก device list
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0
; Remote SSH ต้องให้เครื่อง Ubuntu ปลายทางมองเห็น USB ของบอร์ด

; ถ้า build แล้วฟ้องว่าโปรแกรมใหญ่เกิน flash (เช่น LVGL + WiFi) ให้เปิดบรรทัดนี้
; board_build.partitions = huge_app.csv

build_flags =
  ; ---- จอ TFT: ไดรเวอร์ ILI9341 และ pin (ต้องตรงกับ include/board_config.h) ----
  -D USER_SETUP_LOADED
  -D ILI9341_DRIVER
  -D USE_HSPI_PORT
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH
  -D LOAD_GLCD
  -D LOAD_FONT2
  -D LOAD_FONT4
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=20000000
  ; ---- LVGL: ให้หา lv_conf.h ในโฟลเดอร์ include ----
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -Iinclude
  -std=gnu++17

build_unflags =
  -std=gnu++11

lib_deps =
  bodmer/TFT_eSPI@2.5.43
  bblanchon/ArduinoJson@6.21.5
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#f956c5d8ce3bf39169c7378416b89e7cfe70a034

; ไลบรารีเพิ่มเติมสำหรับ Lab touch / LVGL (เพิ่มใน lib_deps เมื่อต้องใช้)
;   https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
;   lvgl/lvgl@~8.3.11
